<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="centered-page">
    <div class="review-container">
        <div class="back-arrow" onclick="goBack()">
            ← Back
        </div>
        <div class="card review-card">
            <h2>Edit Blog</h2>
            <div class="review-info">
                <strong>Blog:</strong>
                <span id="blogTitle"></span>
            </div>
            <div class="review-info">
                <strong>Category:</strong>
                <span id="blogCategory"></span>
            </div>
            <div class="review-info">
                <strong>Author:</strong>
                <span id="blogAuthor"></span>
            </div>
            <label for="blogContent">Blog</label>
            <textarea id="blogContent" rows="4" placeholder="Write your blog content..."></textarea>
            <button onclick="updateBlog()">Save Changes</button>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/blog.js"></script>
</body>
</html>
