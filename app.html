<!DOCTYPE html>
<html>
<head>
    <title>Blog App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
    <h2>Blog App</h2>
    <div class="topbar-right">
        <span id="userInfo" class="topbar-user"></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">

    <div class="card">
        <h3>Search Blog</h3>
        <input id="blogId" type="number" placeholder="Enter blog ID">
        <button onclick="getBlog()">Search</button>
        <div id="blogCard" class="blog-card" style="display:none;"></div>
    </div>

    <div class="card" style="margin-top:20px;">
        <h3>My Blogs</h3>
        <div id="myBlogs">Loading...</div>
    </div>

</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
